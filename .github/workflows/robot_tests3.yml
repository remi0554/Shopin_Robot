name: Robot Framework Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  robot-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create screenshot directories
        run: |
          mkdir -p LP_Screenshots CP_Screenshots PDP_Screenshots RP_Screenshots

      - name: Run Robot Framework tests
        env:
          URL:       ${{ secrets.URL }}
          USERNAME1: ${{ secrets.USERNAME1 }}
          USERNAME2: ${{ secrets.USERNAME2 }}
          PASSWORD1: ${{ secrets.PASSWORD1 }}
          PASSWORD2: ${{ secrets.PASSWORD2 }}
        run: |
          robot \
            --outputdir results \
            --variable BROWSER:chrome \
            --variable HEADLESS:true \
            tests/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: |
            results/
            LP_Screenshots/
            CP_Screenshots/
            PDP_Screenshots/
            RP_Screenshots/
