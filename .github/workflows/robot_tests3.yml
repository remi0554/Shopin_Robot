name: Robot Framework CI/CD

on:
  push:
    branches: [ Shopin_CI-CD ]
  pull_request:
    branches: [ Shopin_Main ]
  # schedule:
  #   - cron: '0 8 * * *'        # runs every day at 8am
  
  workflow_dispatch:          # ← this enables manual trigger button
    inputs:
      browser:
        description: 'Browser to use'
        required: true
        default: 'chrome'
        type: choice
        options:
          - headless-chrome
          - chrome
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'tests/'
        
jobs:
  robot-tests:
    runs-on: ubuntu-latest

    steps:
      # 1 — Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2 — Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3 — Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4 — Install Chrome
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      # 5 — Install ChromeDriver
      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      # 6 — Create .env file from GitHub Secrets
      - name: Create .env file
        run: |
          echo "USERNAME1=${{ secrets.USERNAME1 }}" >> .env
          echo "PASSWORD1=${{ secrets.PASSWORD1 }}" >> .env

      # 7 — Run Robot Framework tests
      - name: Run Robot Tests
        run: |
          robot --outputdir results \
                --variable BROWSER:chrome \
                tests/

      # 8 — Upload results even if tests fail
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-results
          path: results/

      # 9 — Upload screenshots if tests fail
      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: '**/*.png'
